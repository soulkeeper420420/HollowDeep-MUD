name: HollowDeep accepted changes to Discord

on:
  push:
    branches:
      - main
      - round79-gameplay-qol
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify-change-log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Announce accepted source changes in Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CHANGE_LOG_WEBHOOK }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook.startswith("https://discord.com/api/webhooks/"):
              sys.exit("DISCORD_CHANGE_LOG_WEBHOOK is missing or invalid; Discord was not notified")

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as stream:
              event = json.load(stream)

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          branch = os.environ["GITHUB_REF_NAME"]
          url = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/commit/{sha}"
          commits = event.get("commits") or []
          head = event.get("head_commit") or {}
          message = head.get("message") or (commits[-1].get("message") if commits else "")
          title = message.splitlines()[0].strip() if message.strip() else "Source changes"
          title = title[:240]

          def metadata(label):
              for line in message.splitlines()[1:]:
                  match = re.fullmatch(rf"{re.escape(label)}:\s*(.+)", line.strip(), re.I)
                  if match:
                      return match.group(1)[:240]
              return None

          tests = metadata("Tests") or metadata("Validation") or "Not specified in commit message"
          deployment = metadata("Production") or metadata("Deployment") or (
              "This GitHub notification does not deploy the game"
          )
          count = len(commits)
          more = f"\n**Commits in push:** {count}" if count > 1 else ""
          content = (
              "**HollowDeep MUD — #change-log**\n"
              f"**Branch:** `{branch}`\n"
              f"**Change:** {title}\n"
              f"**Tests:** {tests}\n"
              f"**Production:** {deployment}\n"
              f"**Commit:** {url}" + more
          )[:1900]

          data = json.dumps({
              "username": "HollowDeep Updates",
              "content": content,
              "allowed_mentions": {"parse": []}
          }).encode("utf-8")
          request = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "HollowDeep-Changelog/1.0"
              },
              method="POST"
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status not in (200, 204):
                      sys.exit(f"Discord returned HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              sys.exit(f"Discord rejected the changelog: HTTP {exc.code}")
          except urllib.error.URLError:
              sys.exit("Discord connection failed; no changelog acknowledgement")

          print(f"Discord accepted HollowDeep changelog notification for {sha[:12]}")
          PY
