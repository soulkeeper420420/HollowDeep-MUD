name: Announce GitHub release in Discord

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  discord-announcement:
    name: Announce approved release
    runs-on: ubuntu-latest
    steps:
      - name: Post release to Discord change-log
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CHANGE_LOG_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "")
          if not webhook.startswith("https://discord.com/api/webhooks/"):
              sys.exit("Missing or invalid DISCORD_CHANGE_LOG_WEBHOOK secret")

          tag = os.environ["RELEASE_TAG"]
          name = os.environ.get("RELEASE_NAME") or tag
          url = os.environ["RELEASE_URL"]
          body = os.environ.get("RELEASE_BODY", "").strip()
          kind = "Pre-release" if os.environ.get("RELEASE_PRERELEASE") == "true" else "Release"
          preview = body[:1200] + ("…" if len(body) > 1200 else "")
          message = f"📜 **HollowDeep {kind}: {name[:150]}**\n{url}"
          if preview:
              message += f"\n\n**Notes**\n{preview}"
          message = message[:1950]

          payload = json.dumps({
              "username": "HollowDeep Updates",
              "content": message,
              "allowed_mentions": {"parse": []},
          }).encode("utf-8")
          request = urllib.request.Request(
              webhook,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "HollowDeep-Release-Notifier/1.0",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status not in (200, 204):
                      sys.exit(f"Discord returned HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              sys.exit(f"Discord rejected announcement: HTTP {exc.code}")
          except urllib.error.URLError:
              sys.exit("Discord request failed (connection issue)")
          print("Discord accepted the release announcement")
          PY
